<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 700" role="img" aria-label="Map of Camiguin Island">
  <defs>
    <linearGradient id="ocean" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c4a6e"/>
      <stop offset="45%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#0e7490"/>
    </linearGradient>
    <radialGradient id="shallow" cx="50%" cy="55%" r="55%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="land" x1="30%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="40%" stop-color="#22c55e"/>
      <stop offset="75%" stop-color="#15803d"/>
      <stop offset="100%" stop-color="#14532d"/>
    </linearGradient>
    <linearGradient id="peak" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#78716c" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#15803d" stop-opacity="0"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#022c22" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="500" height="700" fill="url(#ocean)"/>
  <ellipse cx="250" cy="380" rx="220" ry="260" fill="url(#shallow)"/>

  <!-- Camiguin island silhouette (volcanic pear shape, NE-SW orientation) -->
  <g filter="url(#softShadow)">
    <path
      id="camiguin-island"
      fill="url(#land)"
      stroke="#166534"
      stroke-width="2.5"
      stroke-linejoin="round"
      d="M 248 58
         C 278 52, 310 68, 322 98
         C 338 132, 348 168, 352 210
         C 358 258, 360 310, 348 358
         C 336 408, 312 452, 278 488
         C 248 518, 212 538, 178 548
         C 148 556, 118 548, 98 522
         C 78 496, 72 458, 78 418
         C 84 378, 98 338, 118 302
         C 138 268, 162 238, 188 212
         C 208 192, 222 168, 228 142
         C 234 112, 238 82, 248 58 Z"
    />
    <!-- Mt. Hibok-Hibok hint -->
    <ellipse cx="228" cy="268" rx="42" ry="34" fill="url(#peak)"/>
    <ellipse cx="228" cy="258" rx="18" ry="14" fill="#57534e" opacity="0.35"/>
  </g>

  <!-- White Island sandbar (offshore) -->
  <ellipse cx="340" cy="118" rx="22" ry="8" fill="#fef9c3" stroke="#fde047" stroke-width="1.5" opacity="0.95"/>

  <text x="250" y="640" text-anchor="middle" fill="#e0f2fe" font-family="system-ui,sans-serif" font-size="13" font-weight="600" opacity="0.7">
    CAMIGUIN ISLAND � PHILIPPINES
  </text>
</svg>
